<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kukis Colors — Catálogo digital de aretes, anillos, cadenas y pulseras.">
<link rel="icon" href="data:,">
<title>Kukis Colors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#1c1712;
    --ink-soft:#3a3226;
    --gold:#b8935a;
    --gold-deep:#8f6f42;
    --gold-light:#e6cd9d;
    --ivory:#f6f1e6;
    --ivory-deep:#ece2cc;
    --line:#ddcfab;
    --card-bg:#fffdf9;
    --danger:#a4482f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    text-wrap:balance;
    letter-spacing:.01em;
  }
  .kicker{
    text-transform:uppercase;
    letter-spacing:.22em;
    font-size:.68rem;
    font-weight:500;
    color:var(--gold-deep);
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    padding:.6rem clamp(1.2rem,4vw,3rem);
    background:rgba(246,241,230,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  header img{height:64px;width:auto;display:block;}
  .cart-btn{
    position:relative;
    display:flex;align-items:center;gap:.5rem;
    background:var(--ink);color:var(--ivory);
    border:none;border-radius:999px;
    padding:.6rem 1.1rem;
    font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
    transition:background .18s ease;
  }
  .cart-btn:hover{background:var(--ink-soft);}
  .cart-btn svg{width:17px;height:17px;stroke:var(--gold-light);}
  .cart-count{
    position:absolute;top:-7px;right:-7px;
    background:var(--gold);color:var(--ink);
    font-family:'Jost',sans-serif;font-weight:600;font-size:.7rem;
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--ivory);
  }
  .cart-count[hidden]{display:none;}

  /* ---------- Hero ---------- */
  .hero{
    max-width:760px;margin:0 auto;
    padding:clamp(2.4rem,6vw,4rem) 1.5rem 1.8rem;
    text-align:center;
  }
  .hero .kicker{margin-bottom:.9rem;}
  .hero h1{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.3;margin:0 0 1.4rem;color:var(--ink);}
  .divider{display:flex;align-items:center;justify-content:center;gap:.9rem;color:var(--gold);}
  .divider .rule{height:1px;width:64px;background:var(--line);}
  .divider svg{width:14px;height:14px;fill:var(--gold);}

  /* ---------- Filters ---------- */
  .filters{
    max-width:1080px;margin:0 auto;
    display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;
    padding:1.8rem 1.5rem .4rem;
  }
  .filter{
    border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);
    padding:.45rem 1.1rem;border-radius:999px;
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    transition:all .16s ease;
  }
  .filter:hover{border-color:var(--gold);color:var(--ink);}
  .filter.active{background:var(--ink);border-color:var(--ink);color:var(--ivory);}

  /* ---------- Grid ---------- */
  .grid{
    max-width:1080px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:1.6rem;
    padding:1.6rem clamp(1.2rem,4vw,1.5rem) 4rem;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:4px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .card-art{
    position:relative;
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--ivory-deep),var(--ivory));
    color:var(--gold-deep);
  }
  .card-art svg{width:46%;height:46%;}
  .card-photo{width:100%;height:100%;object-fit:cover;display:block;}
  .stock-tag{
    position:absolute;top:.6rem;right:.6rem;
    background:var(--ink);color:var(--gold-light);
    font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
    padding:.28rem .55rem;border-radius:999px;
  }
  .stock-tag.out{background:var(--danger);color:#fff;}
  .card.sold-out .card-art{opacity:.55;}
  .card-body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.35rem;flex:1;}
  .card-body .kicker{font-size:.62rem;}
  .card-body h3{font-size:1.32rem;margin:.05rem 0 0;color:var(--ink);}
  .card-body p{margin:0;font-size:.82rem;color:var(--ink-soft);line-height:1.4;}
  .card-foot{
    margin-top:auto;padding-top:.8rem;
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--line);
  }
  .price{font-variant-numeric:tabular-nums;font-weight:600;font-size:1rem;}
  .add-btn{
    background:none;border:1px solid var(--ink);color:var(--ink);
    padding:.42rem .95rem;border-radius:999px;
    font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
    transition:all .16s ease;
  }
  .add-btn:hover{background:var(--ink);color:var(--ivory);}
  .add-btn.added{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--ivory);}
  .add-btn:disabled{opacity:.4;cursor:not-allowed;background:none;color:var(--ink);}
  .add-btn:disabled:hover{background:none;color:var(--ink);}

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:2.4rem 1.5rem 3rem;
    text-align:center;
    color:var(--ink-soft);
  }
  footer .brand{font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:.06em;color:var(--ink);}
  footer .wa{margin-top:.5rem;font-size:.82rem;}
  footer .wa a{color:var(--gold-deep);text-decoration:none;border-bottom:1px solid var(--gold-light);}

  /* ---------- Cart drawer ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(28,23,18,.42);
    opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40;
  }
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;
    width:min(400px,100%);
    background:var(--ivory);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:41;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.2rem 1.4rem;border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:1.4rem;margin:0;}
  .drawer-close{background:none;border:none;font-size:1.3rem;line-height:1;color:var(--ink-soft);padding:.2rem;}
  .drawer-items{flex:1;overflow-y:auto;padding:1rem 1.4rem;display:flex;flex-direction:column;gap:1rem;}
  .empty-cart{margin:auto;text-align:center;color:var(--ink-soft);font-size:.9rem;max-width:220px;}
  .line-item{display:flex;gap:.8rem;align-items:flex-start;}
  .line-item .li-art{
    width:52px;height:52px;flex:none;border-radius:3px;
    background:var(--ivory-deep);display:flex;align-items:center;justify-content:center;color:var(--gold-deep);
  }
  .line-item .li-art svg{width:60%;height:60%;}
  .li-info{flex:1;min-width:0;}
  .li-info h4{margin:0 0 .15rem;font-size:1.02rem;font-family:'Cormorant Garamond',serif;font-weight:600;}
  .li-info .price{font-size:.85rem;color:var(--ink-soft);font-weight:500;}
  .qty-row{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;}
  .qty-btn{
    width:22px;height:22px;border:1px solid var(--line);background:var(--card-bg);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.85rem;color:var(--ink);
  }
  .qty-val{font-variant-numeric:tabular-nums;font-size:.85rem;min-width:1.2em;text-align:center;}
  .remove-btn{
    background:none;border:none;color:var(--danger);font-size:.7rem;
    letter-spacing:.08em;text-transform:uppercase;padding:0;margin-top:.5rem;
    text-decoration:underline;text-underline-offset:2px;
  }
  .drawer-foot{border-top:1px solid var(--line);padding:1.2rem 1.4rem 1.5rem;}
  .subtotal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem;}
  .subtotal-row span:first-child{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
  .subtotal-row span:last-child{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .checkout-btn{
    width:100%;background:var(--ink);color:var(--ivory);border:none;
    padding:.9rem 1rem;border-radius:4px;
    font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:.55rem;
    transition:background .16s ease;
  }
  .checkout-btn:hover{background:var(--ink-soft);}
  .checkout-btn:disabled{opacity:.45;cursor:not-allowed;}
  .checkout-btn svg{width:16px;height:16px;fill:#fff;}
  .clear-link{
    display:block;text-align:center;margin-top:.7rem;font-size:.7rem;
    color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;
    background:none;border:none;width:100%;text-decoration:underline;text-underline-offset:2px;
  }

  /* ---------- Ficha de producto (galería + descripción) ---------- */
  .card-art{cursor:default;}
  .card-art.has-media{cursor:pointer;}
  .photo-badge{
    position:absolute;bottom:.6rem;left:.6rem;
    display:flex;align-items:center;gap:.3rem;
    background:rgba(28,23,18,.78);color:var(--ivory);
    font-size:.62rem;letter-spacing:.04em;
    padding:.28rem .55rem;border-radius:999px;
  }
  .photo-badge svg{width:12px;height:12px;fill:var(--gold-light);}
  .pmodal-scrim{
    position:fixed;inset:0;background:rgba(28,23,18,.55);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50;
  }
  .pmodal-scrim.open{opacity:1;pointer-events:auto;}
  .pmodal{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-48%);
    width:min(880px,92vw);max-height:88vh;overflow-y:auto;
    background:var(--card-bg);border-radius:6px;
    display:grid;grid-template-columns:1.1fr 1fr;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:51;
  }
  .pmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
  .pmodal-close{
    position:absolute;top:.7rem;right:.9rem;z-index:2;
    background:rgba(28,23,18,.7);color:var(--ivory);border:none;
    width:30px;height:30px;border-radius:50%;font-size:1.2rem;line-height:1;
  }
  .pmodal-gallery{position:relative;background:linear-gradient(160deg,var(--ivory-deep),var(--ivory));}
  .pmodal-main{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pmodal-main img{width:100%;height:100%;object-fit:cover;display:block;}
  .pmodal-main .card-art-icon{width:46%;height:46%;color:var(--gold-deep);}
  .pmodal-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(255,253,249,.85);border:1px solid var(--line);
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--ink);
  }
  .pmodal-arrow.prev{left:.7rem;}
  .pmodal-arrow.next{right:.7rem;}
  .pmodal-thumbs{display:flex;gap:.5rem;padding:.7rem;overflow-x:auto;}
  .pmodal-thumbs img{
    width:52px;height:52px;object-fit:cover;border-radius:3px;cursor:pointer;
    border:2px solid transparent;opacity:.6;flex:none;
  }
  .pmodal-thumbs img.active{border-color:var(--gold);opacity:1;}
  .pmodal-body{padding:1.6rem 1.7rem;display:flex;flex-direction:column;}
  .pmodal-body h2{font-size:1.6rem;margin:.2rem 0 .6rem;}
  .pmodal-body .desc{font-size:.85rem;color:var(--ink-soft);line-height:1.6;white-space:pre-line;margin:0 0 1.2rem;}
  .pmodal-body .price{font-size:1.3rem;margin-bottom:1.1rem;}
  .pmodal-body .add-btn{align-self:flex-start;padding:.6rem 1.4rem;}

  @media (max-width:640px){
    .pmodal{grid-template-columns:1fr;width:92vw;}
  }

  @media (max-width:520px){
    header img{height:48px;}
    .cart-btn span.label{display:none;}
  }
</style>
</head>

  var grid = document.getElementById('grid');
  var filtersEl = document.getElementById('filters');
  var currentCat = 'todo';

  function renderGrid(){
    grid.innerHTML = '';
    PRODUCTS.filter(function(p){return currentCat==='todo' || p.cat===currentCat;}).forEach(function(p){
      var soldOut = p.qty<=0;
      var media = PRODUCT_MEDIA[p.id];
      var tag = soldOut ? '<span class="stock-tag out">Agotado</span>' : (p.qty<=1?'<span class="stock-tag">Última pieza</span>':'');
      var badge = media ? '<span class="photo-badge"><svg viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4" fill="var(--card-bg)"/></svg>Ver '+media.photos.length+(media.photos.length===1?' foto':' fotos')+'</span>' : '';
      var card = document.createElement('div');
      card.className = 'card'+(soldOut?' sold-out':'');
      card.innerHTML =
        '<div class="card-art'+(media?' has-media':'')+'" data-id="'+p.id+'">'+(media?'<img class="card-photo" src="'+media.photos[0]+'" alt="'+p.name+'" loading="lazy">':ICONS[p.icon])+tag+badge+'</div>'+
        '<div class="card-body">'+
          '<div class="kicker">'+p.cat+'</div>'+
          '<h3>'+p.name+'</h3>'+
          '<div class="card-foot">'+
            '<span class="price">S/ '+p.price+'</span>'+
            '<button class="add-btn" data-id="'+p.id+'"'+(soldOut?' disabled':'')+'>'+(soldOut?'Agotado':'Agregar')+'</button>'+
          '</div>'+
        '</div>';
      grid.appendChild(card);
    });
  }

  filtersEl.addEventListener('click', function(e){
    var btn = e.target.closest('.filter');
    if(!btn) return;
    currentCat = btn.dataset.cat;
    filtersEl.querySelectorAll('.filter').forEach(function(f){f.classList.toggle('active', f===btn);});
    renderGrid();
  });

  /* ---------- Cart state ---------- */
  var cart = {};
  function loadCart(){
    try{
      var raw = localStorage.getItem('kukis_cart');
      if(raw) cart = JSON.parse(raw) || {};
    }catch(e){ cart = {}; }
  }
  function saveCart(){
    try{ localStorage.setItem('kukis_cart', JSON.stringify(cart)); }catch(e){}
  }
  function productById(id){ return PRODUCTS.find(function(p){return p.id===id;}); }

  function addToCart(id){
    var p = productById(id);
    var max = p ? p.qty : 99;
    cart[id] = Math.min((cart[id]||0) + 1, max);
    saveCart(); renderAll();
  }
  function changeQty(id, delta){
    if(!cart[id]) return;
    var p = productById(id);
    var max = p ? p.qty : 99;
    cart[id] = Math.min(cart[id] + delta, max);
    if(cart[id] <= 0) delete cart[id];
    saveCart(); renderAll();
  }
  function removeItem(id){
    delete cart[id];
    saveCart(); renderAll();
  }
  function clearCart(){
    cart = {};
    saveCart(); renderAll();
  }

  function cartCount(){
    return Object.keys(cart).reduce(function(sum,id){return sum+cart[id];},0);
  }
  function cartTotal(){
    return Object.keys(cart).reduce(function(sum,id){
      var p = productById(id); return p ? sum + p.price*cart[id] : sum;
    },0);
  }

  var cartCountEl = document.getElementById('cartCount');
  var drawerItems = document.getElementById('drawerItems');
  var subtotalEl = document.getElementById('subtotal');
  var checkoutBtn = document.getElementById('checkoutBtn');

  function renderCart(){
    var ids = Object.keys(cart);
    if(ids.length === 0){
      drawerItems.innerHTML = '<div class="empty-cart">Tu carrito está vacío. Elige piezas del catálogo para armar tu pedido.</div>';
      checkoutBtn.disabled = true;
    } else {
      drawerItems.innerHTML = ids.map(function(id){
        var p = productById(id); if(!p) return '';
        return '<div class="line-item">'+
          '<div class="li-art">'+ICONS[p.icon]+'</div>'+
          '<div class="li-info">'+
            '<h4>'+p.name+'</h4>'+
            '<div class="price">S/ '+p.price+'</div>'+
            '<div class="qty-row">'+
              '<button class="qty-btn" data-act="dec" data-id="'+id+'">&minus;</button>'+
              '<span class="qty-val">'+cart[id]+'</span>'+
              '<button class="qty-btn" data-act="inc" data-id="'+id+'">+</button>'+
            '</div>'+
            '<button class="remove-btn" data-act="rm" data-id="'+id+'">Quitar</button>'+
          '</div>'+
        '</div>';
      }).join('');
      checkoutBtn.disabled = false;
    }
    var count = cartCount();
    cartCountEl.hidden = count===0;
    cartCountEl.textContent = count;
    subtotalEl.textContent = 'S/ '+cartTotal();
  }

  function renderAll(){ renderGrid(); renderCart(); }

  grid.addEventListener('click', function(e){
    var btn = e.target.closest('.add-btn');
    if(btn){
      addToCart(btn.dataset.id);
      btn.classList.add('added');
      btn.textContent = 'Agregado';
      setTimeout(function(){ btn.classList.remove('added'); btn.textContent='Agregar'; }, 900);
      return;
    }
    var art = e.target.closest('.card-art.has-media');
    if(art){ openProductModal(art.dataset.id); }
  });

  drawerItems.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if(!btn) return;
    var id = btn.dataset.id, act = btn.dataset.act;
    if(act==='inc') changeQty(id, 1);
    if(act==='dec') changeQty(id, -1);
    if(act==='rm') removeItem(id);
  });

  document.getElementById('clearCart').addEventListener('click', clearCart);

  /* ---------- Drawer open/close ---------- */
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
  document.getElementById('openCart').addEventListener('click', openDrawer);
  document.getElementById('closeCart').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

  /* ---------- Ficha de producto: galería + descripción ---------- */
  var pmodal = document.getElementById('pmodal');
  var pmodalScrim = document.getElementById('pmodalScrim');
  var pmodalMain = document.getElementById('pmodalMain');
  var pmodalThumbs = document.getElementById('pmodalThumbs');
  var pmodalCat = document.getElementById('pmodalCat');
  var pmodalName = document.getElementById('pmodalName');
  var pmodalDesc = document.getElementById('pmodalDesc');
  var pmodalPrice = document.getElementById('pmodalPrice');
  var pmodalAdd = document.getElementById('pmodalAdd');
  var pmodalPrev = document.getElementById('pmodalPrev');
  var pmodalNext = document.getElementById('pmodalNext');
  var currentModalProduct = null;
  var currentPhotoIndex = 0;

  function renderModalPhoto(){
    var media = PRODUCT_MEDIA[currentModalProduct.id];
    pmodalMain.innerHTML = '<img src="'+media.photos[currentPhotoIndex]+'" alt="'+currentModalProduct.name+'">';
    pmodalThumbs.querySelectorAll('img').forEach(function(t,i){
      t.classList.toggle('active', i===currentPhotoIndex);
    });
  }

  function openProductModal(id){
    var p = productById(id);
    var media = PRODUCT_MEDIA[id];
    if(!p || !media) return;
    currentModalProduct = p;
    currentPhotoIndex = 0;
    pmodalCat.textContent = p.cat;
    pmodalName.textContent = p.name;
    pmodalDesc.textContent = media.desc || '';
    pmodalPrice.textContent = 'S/ '+p.price;
    pmodalAdd.dataset.id = p.id;
    pmodalAdd.disabled = p.qty<=0;
    pmodalAdd.textContent = p.qty<=0 ? 'Agotado' : 'Agregar al carrito';
    pmodalThumbs.innerHTML = media.photos.map(function(src,i){
      return '<img src="'+src+'" data-i="'+i+'" alt="Foto '+(i+1)+'">';
    }).join('');
    renderModalPhoto();
    pmodal.classList.add('open');
    pmodalScrim.classList.add('open');
  }
  function closeProductModal(){
    pmodal.classList.remove('open');
    pmodalScrim.classList.remove('open');
    currentModalProduct = null;
  }
  function stepPhoto(delta){
    var media = PRODUCT_MEDIA[currentModalProduct.id];
    var n = media.photos.length;
    currentPhotoIndex = (currentPhotoIndex + delta + n) % n;
    renderModalPhoto();
  }

  document.getElementById('pmodalClose').addEventListener('click', closeProductModal);
  pmodalScrim.addEventListener('click', closeProductModal);
  pmodalPrev.addEventListener('click', function(){ stepPhoto(-1); });
  pmodalNext.addEventListener('click', function(){ stepPhoto(1); });
  pmodalThumbs.addEventListener('click', function(e){
    var t = e.target.closest('img[data-i]');
    if(!t) return;
    currentPhotoIndex = Number(t.dataset.i);
    renderModalPhoto();
  });
  pmodalAdd.addEventListener('click', function(){
    if(pmodalAdd.disabled) return;
    addToCart(pmodalAdd.dataset.id);
    pmodalAdd.textContent = 'Agregado ✓';
    setTimeout(function(){ if(currentModalProduct) pmodalAdd.textContent = 'Agregar al carrito'; }, 900);
  });
  document.addEventListener('keydown', function(e){
    if(!pmodal.classList.contains('open')) return;
    if(e.key === 'Escape') closeProductModal();
    if(e.key === 'ArrowLeft') stepPhoto(-1);
    if(e.key === 'ArrowRight') stepPhoto(1);
  });

  /* ---------- Google Sheets: leer stock real ---------- */
  function syncStockFromSheet(){
    if(!SHEET_API_URL || SHEET_API_URL.indexOf('http')!==0) return;
    fetch(SHEET_API_URL + '?action=stock')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data || !data.ok || !Array.isArray(data.products)) return;
        var byName = {};
        data.products.forEach(function(p){ byName[normalizeName(p.name)] = p; });
        PRODUCTS.forEach(function(p){
          var match = byName[normalizeName(p.name)];
          if(match) p.qty = match.qty;
        });
        renderAll();
      })
      .catch(function(){ /* sin conexión al Excel: se queda con el stock local */ });
  }

  /* ---------- Google Sheets: registrar pedido ---------- */
  function sendOrderToSheet(ids){
    if(!SHEET_API_URL || SHEET_API_URL.indexOf('http')!==0) return;
    var items = ids.map(function(id){
      var p = productById(id);
      return { name: p.name, qty: cart[id], price: p.price };
    });
    try{
      fetch(SHEET_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action:'order', items:items })
      }).catch(function(){});
    }catch(e){}
  }

  /* ---------- WhatsApp checkout ---------- */
  checkoutBtn.addEventListener('click', function(){
    var ids = Object.keys(cart);
    if(ids.length===0) return;
    var lines = ids.map(function(id){
      var p = productById(id);
      return cart[id]+'x '+p.name+' — S/ '+(p.price*cart[id]);
    });
    var msg = 'Hola, Kukis Colors. Quiero hacer el siguiente pedido:\n\n'
      + lines.join('\n')
      + '\n\nTotal: S/ '+cartTotal()
      + '\n\nNombre:\nDirección de envío:';
    sendOrderToSheet(ids);
    var url = 'https://wa.me/51969080504?text=' + encodeURIComponent(msg);
    window.open(url, '_blank', 'noopener');
  });

  loadCart();
  renderAll();
  syncStockFromSheet();
})();
